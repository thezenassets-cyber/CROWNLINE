# Render Blueprint for Crownline Express.
# Node is pinned with NODE_VERSION. Do not set nodeVersion; Render rejects that field.
# The instance needs 2 GB. The 512 MB Starter plan runs out of memory while opening the database.

previewsEnabled: false

services:
  - type: web
    name: crownlineexpress
    runtime: node
    plan: 1c-2g
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: crownline-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - crownlineexpress.com
      - www.crownlineexpress.com
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: ALLOW_EMBEDDED_DB
        value: "true"
      - key: EMBEDDED_DB_DIR
        value: /var/data/pglite
      - key: DATABASE_SSL
        value: require
      - key: PRICING_MODE
        value: disabled
      - key: COMPANY_LEGAL_NAME
        value: Crownline Express
      - key: TRACKING_CODE_SECRET
        generateValue: true
      - key: TRACKING_CODE_TTL_DAYS
        value: "0"
